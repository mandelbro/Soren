[project]
name = "soren"
version = "0.1.0"
description = "Soren Desktop Agent Framework — Vision-based autonomous task execution"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "python-dotenv>=1.2.4",
    "cua-computer>=0.5.19,<0.6",
    "cua-agent[uitars-mlx]>=0.8.4,<0.9",
    "ollama>=0.6.3",
    "mlx-vlm>=0.7.12,<0.8",
    # Linux mlx wheels ship without a backend; the CPU one lets tests import mlx in Linux sandboxes/CI.
    "mlx[cpu]; sys_platform == 'linux'",
    "pydantic>=2.14",
    "cryptography>=50.0",
    "pyyaml>=6.0",
    "click>=8.5",
    "aiosqlite>=0.20",
    "opencv-python>=5.0",
    "rich>=15.0",
    "structlog>=26.1",
    "vncdotool>=1.4.2",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff>=0.17.5",
    "pytest-cov>=7.1",
    "pyright[nodejs]>=1.1.414",
    "pre-commit>=4.7",
]

[project.scripts]
soren = "soren.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soren"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B904",    # raise from in except (fix incrementally)
    "B905",    # zip without strict= (fix incrementally)
    "UP042",   # str(Enum) -> StrEnum (fix incrementally across many files)
]

[tool.ruff.lint.isort]
known-first-party = ["soren"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests", "src/soren/patches"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration (require live VM, models)",
    "e2e: marks tests as end-to-end (require live VM, Lume, models)",
]

[tool.coverage.run]
source = ["src/soren"]

[tool.coverage.report]
fail_under = 60
show_missing = true
