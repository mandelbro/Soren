# Soren Desktop Agent Framework — Configuration
# See docs/rfc.md for full specification

scheduler:
  max_task_retries: 3
  retry_backoff_minutes: [5, 30, 120]
  priority_weights:
    reward: 0.3
    persona_fit: 0.2
    success_rate: 0.2
    backlog_age: 0.3

backlog:
  max_age_days: 30
  max_tasks_per_persona: 100

playbooks:
  base_dir: "data/playbooks"
  write_back: true

llm:
  primary_model: "gemma4:31b-cloud"
  fallback_model: "gemma4:e4b"

vlm:
  provider: "mlx"
  model: "mlx-community/UI-TARS-1.5-7B-6bit"

verification:
  provider: "ollama"
  model: "qwen3-vl:235b-cloud"

# Enter key patch: "enter_only" (default) or "escape_enter" (Escape before Enter for Slack etc.)
enter_key_behavior: "enter_only"

services:
  # Per-service override example:
  # slack:
  #   enter_key_behavior: "escape_enter"

vm:
  name: "soren-vm"
  pristine_name: "soren-pristine"
  memory_gb: 8
  # NOTE: display resolution is currently fixed to whatever the pristine VM
  # image was created with (1024x768 in the current soren-pristine). CUA's
  # lume_api_run at `computer/providers/lume_api.py` does NOT pass display
  # into the Lume run payload, so a `display: ...` field here is ignored at
  # boot. As of Lume 0.7.2, `PATCH /lume/vms/:name` accepts `display` on a
  # stopped VM, so the resolution can be changed without rebuilding
  # soren-pristine (e.g. `lume set soren-pristine --display 1280x800`); Soren
  # does not do this automatically yet.
  # For now we accept 1024x768 and rely on SOREN_CHROME_CROP_Y=100 to give
  # UI-TARS a 1024x668 webpage-only view (see ADR-0001).
  recreate_every_n_cycles: 10
  lume_url: "http://localhost:7777"
  # Session isolation: keep desktop clean for vision workflows.
  session_isolation_enabled: true
  create_new_space_per_session: true
  # Add app names here if a workflow needs non-browser GUI apps.
  allowed_apps: ["Safari"]
  app_quit_grace_period_s: 1.0
  space_switch_retries: 2
