exclude: '^(\.claude-flow/|\.swarm/|\.hive-mind/|\.claude/skills/)'
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(map|cjs|d\.ts|d\.cts|html)$'
      - id: trailing-whitespace
        exclude: '\.(map|cjs|d\.ts|d\.cts|html)$'
