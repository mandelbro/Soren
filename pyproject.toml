[project]
name = "soren"
version = "0.1.0"
description = "Soren Desktop Agent Framework — Vision-based autonomous task execution"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.0",
    "cua-computer>=0.5,<0.6",
    "cua-agent[uitars-mlx]>=0.7",
    "ollama>=0.4",
    "mlx-vlm>=0.3,<0.5",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "aiosqlite>=0.20",
    "opencv-python>=4.9",
    "rich>=13.0",
    "structlog>=24.0",
    "vncdotool>=1.2",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[project.scripts]
soren = "soren.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soren"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration (require live VM, models)",
    "e2e: marks tests as end-to-end (require live VM, Lume, models)",
]

[tool.coverage.run]
source = ["src/soren"]
