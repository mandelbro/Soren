# Example persona. Copy it to a new file in this folder and set enabled: true
# to use it. Persona files other than this one are local and gitignored,
# because they hold real identities and service accounts.
name: Example Analyst
id: example
description: Survey participant persona
demographics:
  age: "35-44"
  occupation: Software Engineer
  education: Bachelor's
  location: United States
traits:
  conscientiousness: 0.8
  openness: 0.7
  agreeableness: 0.6
  extraversion: 0.5
  neuroticism: 0.3
preferences:
  response_style: balanced
  formality: professional
  decision_speed: moderate
# Each source points at a service definition in config/services/<name>.yaml,
# which holds its url, type, discovery hint and settings. Credentials stay here
# because they belong to the persona. Fields set inline (e.g. url:) override the
# service file; old-style sources with no `service:` and everything inline still
# work (see docs/adr/0002-service-configuration.md).
task_sources:
  - service: acmepanel
    credential_ref: acmepanel
    enabled: true
enabled: false
